# The "stable" deployment: what's currently serving real traffic. The
# canary controller only promotes a new model version here after the
# canary deployment (canary.yaml) proves healthy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fenris-inference-stable
  labels:
    app: fenris-inference
    track: stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fenris-inference
      track: stable
  template:
    metadata:
      labels:
        app: fenris-inference
        track: stable
    spec:
      nodeSelector:
        node-type: arm
      containers:
        - name: inference
          image: fenris-inference:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MODEL_PATH
              value: /app/model/checkpoints/model.pkl
            - name: MODEL_VERSION
              value: v1
            - name: NODE_TYPE
              value: arm
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fenris-inference-stable
spec:
  selector:
    app: fenris-inference
    track: stable
  ports:
    - port: 8080
      targetPort: 8080
